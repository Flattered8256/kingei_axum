[package]
name = "chat"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1",features = ["macros","rt-multi-thread"] }
sqlx = { version = "0.9",features = ["runtime-tokio", "sqlite", "derive"]}
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }